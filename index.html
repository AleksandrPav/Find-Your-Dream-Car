<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/main.css">
    <title>Game Website</title>
</head>
<body>
    <div class="navigation">
    <header class="conteiner">
        <div class="logo">
            <img class="logo--img" src="/img/logo.png" alt="Logo">
        </div>
          <div class="ellips">
            <img class="ellips--one" src="/img/Ellipse 4.png" alt="ellips">
            <img class="ellips--two" src="/img/Ellipse 3.png" alt="ellips">
        </div>
        <nav class="main-nav">
            <ul class="nav-list">
                <li class="active nav--item"><a href="*">Home</a></li>
                <li class="nav--item"><a href="*">About</a></li>
                <li class="nav--item"><a href="*">Services</a></li>
                <li class="nav--item"><a href="*">Contact</a></li>
            </ul>
        </nav>
    </header>
    <div class="hero conteiner">
        <div class="hero--info">
            <h1 class="page-title">Find Your <br> Dream Car</h1>
            <p class="page-subtext">Lorem Ipsum has been <br> the industry's standard dummy text <br> ever since</p>
            <button class="btn">Read More</button>
        </div>
        <div class="img--car">
        <img  src="/img/car.png" alt="Car">
        </div>
    </div>
    </div>
    <main>
        <div class="car--grid">
            <ul class="car--grid-list">
                <li class="car--grid-item">
                    <img class="car--grid-img" src="/img/Sedan.svg" alt="Sedan">
                    <h3 class="car--title">Sedan</h3>
                </li>
                <li class="car--grid-item">
                    <img class="car--grid-img"  src="/img/Cabriolet.svg" alt="Cabriolet">
                    <h3 class="car--title">Cabriolet</h3>
                </li>
                <li class="car--grid-item">
                    <img class="car--grid-img" src="/img/Coupe.svg" alt="Coupe">
                    <h3 class="car--title">Coupe</h3>
                </li>
                <li class="car--grid-item">
                    <img class="car--grid-img" src="/img/SUV.svg" alt="SUV">
                    <h3 class="car--title">SUV</h3>
                </li>
                <li class="car--grid-item">
                    <img class="car--grid-img" src="/img/Micro.svg" alt="Micro">
                    <h3 class="car--title">Micro</h3>
                </li>
            </ul>
        </div>



    </main>
    
</body>
</html>
